# =============================================================================
# MediSphere Frontend — Nginx Configuration
# Phase 8 — B8.2
#
# Responsibilities:
#   1. Serve the Vite/React SPA static files
#   2. SPA fallback: all non-asset routes → index.html (React Router)
#   3. Reverse-proxy /api/** to the backend Spring Boot service
#   4. Reverse-proxy /ws/** (WebSocket/SockJS) to backend with upgrade headers
#   5. Security headers
# =============================================================================

# Run as non-root (nginx default in alpine)
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Upstream: Spring Boot backend
    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;

        # ── Static assets root ──────────────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── /api reverse proxy → Spring Boot ────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Forward cookies (required for httpOnly refresh_token cookie)
            proxy_pass_header  Set-Cookie;

            # Timeouts generous enough for long-running API calls
            proxy_connect_timeout 30s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # ── /ws WebSocket / SockJS proxy → Spring Boot ──────────────────────
        location /ws {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;   # keep WS connections alive
        }

        # ── Actuator health (direct, no auth required) ───────────────────────
        location /actuator/health {
            proxy_pass       http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ── SPA fallback ─────────────────────────────────────────────────────
        # Any URL that does not match a real file falls back to index.html
        # so that React Router can handle client-side routing.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Static asset caching ─────────────────────────────────────────────
        # Vite produces content-hashed filenames — cache aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── Deny dot-file access ─────────────────────────────────────────────
        location ~ /\. {
            deny all;
        }
    }
}
