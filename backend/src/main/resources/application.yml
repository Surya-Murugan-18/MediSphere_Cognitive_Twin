server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: medisphere-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017}
      database: ${MONGODB_DB:medisphere}
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: medisphere-backend
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

medisphere:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-seconds: ${JWT_ACCESS_EXPIRY:900}
    refresh-token-expiry-seconds: ${JWT_REFRESH_EXPIRY:2592000}
    issuer: medisphere
  fhir:
    mode: ${FHIR_MODE:mock}
    base-url: ${FHIR_BASE_URL:}
    smart-client-id: ${FHIR_CLIENT_ID:}
    smart-client-secret: ${FHIR_CLIENT_SECRET:}
  ai:
    prediction:
      mode: ${AI_PREDICTION_MODE:stub}        # stub | tff
      tff-endpoint: ${TFF_ENDPOINT:}
    careplan:
      mode: ${AI_CAREPLAN_MODE:stub}          # stub | tff
  federated:
    mode: ${FEDERATED_MODE:stub}              # stub | live
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  audit:
    enabled: true
  # ── Phase 5 ────────────────────────────────────────────────────────────
  wearable:
    offline-threshold-minutes: ${WEARABLE_OFFLINE_THRESHOLD:30}
  anomaly:
    hr-spike-percentile: ${ANOMALY_HR_SPIKE_PERCENTILE:95}
    hr-history-window: ${ANOMALY_HR_HISTORY_WINDOW:50}
    hr-min-samples: ${ANOMALY_HR_MIN_SAMPLES:5}
    spo2-low-threshold: ${ANOMALY_SPO2_LOW_THRESHOLD:94.0}
    bp-systolic-threshold: ${ANOMALY_BP_SYSTOLIC_THRESHOLD:140}
    bp-diastolic-threshold: ${ANOMALY_BP_DIASTOLIC_THRESHOLD:90}
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}
    interval-seconds: ${SIMULATOR_INTERVAL:5}

logging:
  level:
    com.medisphere: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.springframework.data.mongodb: WARN
